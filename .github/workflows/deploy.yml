name: Build & Deploy to Vercel

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build/web/**'   # évite la boucle infinie quand CI commit les artefacts

permissions:
  contents: write   # requis pour le commit & push de build/web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Générer supabase_config.dart
        run: |
          mkdir -p lib/core/config
          cat > lib/core/config/supabase_config.dart <<EOF
          class SupabaseConfig {
            static const String url = '${{ secrets.SUPABASE_URL }}';
            static const String anonKey = '${{ secrets.SUPABASE_ANON_KEY }}';
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter Web (release)
        run: flutter build web --release

      - name: Commit & push build/web
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/web
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: update build/web [skip ci]"
          git push || {
            # Push rejeté : une autre run concurrente a peut-être déjà poussé le même build.
            echo "Push rejeté, vérification si build/web est déjà à jour sur origin..."
            git fetch origin main
            git diff --quiet HEAD origin/main -- build/web && echo "build/web déjà synchronisé par une autre run, rien à faire" && exit 0
            echo "Conflit réel sur build/web — intervention manuelle requise" && exit 1
          }
