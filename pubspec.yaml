name: avarie_app
description: Application de gestion interne pour cabinet de commissaire d'avarie — Gabon
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend & Auth
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.5.1

  # Base de données locale (offline-first)
  drift: ^2.20.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.3

  # Navigation
  go_router: ^14.0.2

  # PDF (génération locale, fonctionne offline)
  pdf: ^3.11.1
  printing: ^5.13.1

  # Formulaires
  flutter_form_builder: ^10.0.0
  form_builder_validators: ^11.0.0

  # Fichiers & médias
  file_picker: ^8.0.7
  image_picker: ^1.1.2

  # Réseau & connectivité
  connectivity_plus: ^6.0.3

  # Sécurité
  flutter_secure_storage: ^9.2.2

  # Graphiques
  fl_chart: ^0.68.0

  # Sécurité documents
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  crypto: ^3.0.3

  # Utilitaires
  uuid: ^4.4.2
  intl: any
  shared_preferences: ^2.3.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.20.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
